name: Build Linux & Windows

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_NUMBER: ${{ github.run_number }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential wget unzip pkg-config \
            libxml2-dev liblzma-dev zlib1g-dev libbz2-dev liblz4-dev \
            libzstd-dev libssl-dev

      - name: Make Premake executable
        run: chmod +x tools/premake/premake5

      - name: Generate Makefiles with Premake
        run: ./tools/premake/premake5 gmake2

      - name: Build Linux binary
        run: make config=release_x64
        env:
          CFLAGS: "-I/usr/include/libxml2"
          LDFLAGS: "-L/usr/lib/x86_64-linux-gnu"

      - name: Prepare env folder
        run: |
          mkdir -p env/bin
          rm -rf env/bin/*
          cp out/bin/x64/Release/* env/bin/

      - name: Remove placeholder .stub files
        run: |
          find env -name "*.stub" -type f -delete

      - name: Create Linux package
        run: |
          tar -czf ahnalytic_nightly_linux_${{ env.BUILD_NUMBER }}.tar.gz -C env .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ahnalytic-linux
          path: ahnalytic_nightly_linux_${{ env.BUILD_NUMBER }}.tar.gz


  build-windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Generate Visual Studio solution
        run: tools\premake\premake5.exe vs2022

      - name: Build Windows binary with MSVC
        run: msbuild Ahnalytic.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare env folder
        run: |
          powershell -Command "
            if (!(Test-Path 'env/bin')) {
              New-Item -ItemType Directory -Path 'env/bin' | Out-Null
            }
            Remove-Item 'env/bin/*' -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item -Path 'out/bin/x64/Release/*' -Destination 'env/bin/' -Recurse -Force
          "

      - name: Remove placeholder .stub files
        run: |
          powershell -Command "
            Get-ChildItem -Path env -Recurse -Filter '*.stub' | Remove-Item -Force
          "

      - name: Create Windows package
        run: |
          powershell -Command "
            Add-Type -AssemblyName 'System.IO.Compression.FileSystem';
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              'env',
              'ahnalytic_nightly_windows_${{ env.BUILD_NUMBER }}.zip'
            )
          "

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ahnalytic-windows
          path: ahnalytic_nightly_windows_${{ env.BUILD_NUMBER }}.zip