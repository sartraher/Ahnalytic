name: Build Linux & Windows

# Force Node.js 24 for all JS-based actions (future-proof)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential wget unzip pkg-config \
            libxml2-dev liblzma-dev zlib1g-dev libbz2-dev libssl-dev

      - name: Make Premake executable
        run: chmod +x tools/premake/premake5

      - name: Generate Makefiles with Premake
        run: ./tools/premake/premake5 gmake2

      - name: Show make targets (debug)
        run: make help

      - name: Build Linux binary
        run: make config=release_x64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: out/bin/x64/Release_x64/*

  build-windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Generate Visual Studio solution
        run: tools\premake\premake5.exe vs2022

      - name: Build Windows binary with MSVC
        run: msbuild Ahnalytic.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: out/bin/x64/Release/*